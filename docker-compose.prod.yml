services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      # Dockerfile.web, not the plain Dockerfile worker/beat below use —
      # this is the only service that renders the CMMC evidence-pack PDF
      # (app/services/cmmc_pdf.py) and needs Playwright's Chromium
      # (~280MB) baked in. Keeping worker/beat on the lean Dockerfile
      # avoids paying that cost three times over for no reason.
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    env_file: .env.prod
    # Build-order item 7: signed evidence packs (app/services/
    # cmmc_issuance.py, ISSUED_PACKS_DIR) MUST survive a redeploy — a
    # bare directory inside the container does not. `docker compose up -d
    # --build` recreates this container from a fresh image on every
    # deploy (confirmed via the actual deploy log), so anything written
    # to the container's own ephemeral layer at runtime is gone the
    # moment it's torn down. A named volume is Docker-managed state
    # external to the image, the same mechanism already protecting
    # `pgdata` below across every redeploy. Still only a single-EC2-
    # instance safeguard, not off-site backup — logged to BACKLOG.md,
    # S3 is the eventual real answer.
    volumes:
      - issued_packs_data:/app/issued_packs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    # Single worker is deliberate, not a default: Live Arena Mode's realtime
    # state (WS connection routing, matchmaking queue, spectator registry,
    # the Live Breach Events Phase 4/5 background sweep loop) all live in
    # one in-process ConnectionManager singleton per app/websocket/manager.py.
    # With >1 uvicorn worker, each is a separate OS process with its own
    # independent singleton, and nginx (nginx/breachreplay.conf) has no
    # upstream/ip_hash config giving one client's connections session
    # affinity to a specific worker — two matched players (or a spectator
    # and the match they're watching) could silently land on different
    # workers and never see each other. Do not raise this without first
    # moving that shared state to Redis or adding real sticky routing.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: celery -A app.pipeline.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: celery -A app.pipeline.celery_app beat --loglevel=info

volumes:
  pgdata:
  issued_packs_data:
