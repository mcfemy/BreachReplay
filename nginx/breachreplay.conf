server {
    server_name breachreplay.com www.breachreplay.com _;
    server_tokens off;

    # Security headers for the nginx-served static SPA (/, /index.html, and
    # the fingerprinted-assets location below) are added per-location, NOT
    # here at server level. Reason: /api/ and /ws are reverse-proxied to the
    # FastAPI backend, which already sets its own security headers via
    # SecurityHeadersMiddleware in backend/app/main.py (a stricter,
    # API-appropriate CSP with frame-ancestors 'none' and HSTS w/ preload).
    # add_header directives at this level WOULD cascade into every location
    # that doesn't declare its own — including /api/ and /ws — producing
    # duplicate, conflicting headers (confirmed by curl: two X-Frame-Options
    # values, two different Content-Security-Policy values) the first time
    # this was tried. Scoping to just the SPA locations avoids that entirely.
    #
    # CSP notes for the SPA's own policy (see the /  location below):
    #   - style-src needs 'unsafe-inline': this SPA uses React inline style={{}}
    #     attributes (dynamic values that can't be static Tailwind classes) in
    #     several pages — confirmed via grep across frontend/src before adding
    #     this, not a reflexive default. script-src stays strict ('self' only,
    #     no unsafe-inline/unsafe-eval) since index.html only ever loads one
    #     external module script, no inline <script> tags anywhere.
    #   - fonts.googleapis.com/fonts.gstatic.com: the only external resource
    #     this app loads (frontend/src/index.css's Google Fonts @import).
    #   - connect-src includes wss://breachreplay.com explicitly for the Arena
    #     Mode / Live Breach Events WebSocket connections, rather than relying
    #     on implicit 'self' scheme-matching behavior.
    #   - frame-ancestors 'self' matches X-Frame-Options SAMEORIGIN below
    #     (kept both for older-browser fallback coverage).

    # API — FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    # Health checks — FastAPI's /health, /health/db, /health/redis
    # (backend/app/main.py) live at the app root, not under /api/, so
    # without this they fall through to the SPA catch-all below and
    # `try_files` serves index.html — a 200 regardless of whether the
    # backend, DB, or Redis are actually up. A monitoring check that
    # cannot fail is worse than no check at all: it would have reported
    # healthy straight through last week's crash-loop. Prefix match (not
    # `=  /health`) so /health/db and /health/redis are covered too.
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # WebSocket — simulation rooms
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Well-known files (Microsoft/Apple domain verification)
    location ^~ /.well-known/ {
        root /var/www/breachreplay;
        default_type application/json;
        try_files $uri =404;
    }

    # index.html references fingerprinted asset filenames — it must always be
    # revalidated, or browsers keep serving a stale SPA shell pointing at
    # deleted bundle names for up to a day after every deploy.
    location = /index.html {
        root /var/www/breachreplay;
        add_header Cache-Control "no-cache";
        # add_header does not inherit into a location that sets its own —
        # security headers must be repeated here (see server-level comment above).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://breachreplay.com wss://breachreplay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # React SPA — static build served by nginx
    location / {
        root /var/www/breachreplay;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://breachreplay.com wss://breachreplay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Long-cache fingerprinted assets
    location ~* \.(js|css|woff2?|png|jpg|ico|svg)$ {
        root /var/www/breachreplay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://breachreplay.com wss://breachreplay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/breachreplay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/breachreplay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.breachreplay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = breachreplay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name breachreplay.com www.breachreplay.com _;
    return 404; # managed by Certbot




}
