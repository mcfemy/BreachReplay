name: Claude Code

# Standard @claude mention responder — issue comments, PR review comments,
# PR reviews, and freshly-opened/assigned issues containing "@claude". Full
# write access, unlike the review-only claude-review.yml.
#
# base_branch is always main — an issue-triggered run has no existing
# PR/branch context to inherit, so this is what a cold dispatch falls back
# to. During Phase 2 this was briefly hardcoded to phase-2-action-console
# instead (Items 0-3, everything Item 4+ built on, lived only on that
# branch — a run cut from main found this out the hard way in issue #3: it
# correctly refused to reimplement the Item 0-3 foundation from scratch
# rather than open a divergent, non-merging PR, and flagged the base branch
# as the fix). Per STATE.md's durable convention, every phase now merges to
# main promptly instead of staying a long-lived integration branch, so main
# is always current and always the right base — this line should never
# need to change again at a future phase boundary.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read this PR's CI/review run results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
