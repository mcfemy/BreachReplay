name: CI

on:
  push:
    branches: [main]
  # No branches: filter — runs for PRs targeting any branch (e.g.
  # phase-2-action-console), not just main. Phase 2 PRs otherwise get no
  # CI besides claude-review.yml's own pytest run; two independent test
  # gates is the point.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run tests
        run: pytest -q
        working-directory: backend
