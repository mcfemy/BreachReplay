name: Claude PR Review

# Automated QA reviewer for Phase 2+ work. Applies REVIEW_CRITERIA.md
# against PHASE2_STATE.md and docs/BREACHREPLAY_GAME_OVERHAUL_SPEC.md and
# posts a verdict, then gates this job's own pass/fail on that verdict so
# branch protection actually blocks a merge on CHANGES REQUESTED (see the
# "Gate the check on the posted verdict" step below).
#
# Cost-reduction rework (see REVIEW_CRITERIA.md (i)/(j)/(m)/(n) for the
# full reasoning behind each piece):
#   - The reviewer no longer runs pytest itself. ci.yml already runs the
#     full suite independently on the same commit — this job waits for
#     that check's conclusion via `gh` and trusts it as independent machine
#     evidence, the same category of evidence as if Claude had run it
#     directly. Red CI blocks the PR with zero Claude turns spent. This is
#     also why the Python setup/dependency-install steps are gone — they
#     existed only to support a test run that no longer happens here.
#   - --max-turns scales to the diff size (15 default, 50 only past ~400
#     changed lines) instead of a flat 50 for every PR — two runaway
#     reviews on PR #5 burned real money producing nothing before this.
#   - Docs-only PRs (only .md files / docs/) skip the Claude review
#     entirely — a one-line skip comment passes the gate for free. PR #12
#     (a docs-only PR) cost $0.42 and produced no verdict before this.
#   - A cheap 1-turn preflight call runs before the real review to detect
#     "the Claude API itself is unreachable" (billing/auth/quota) and
#     report that distinctly from a genuine review failure — see
#     REVIEW_CRITERIA.md (j) for why conflating these is a trust problem,
#     not just a cosmetic one.
#
# A PR comment posted via a workflow job's DEFAULT GITHUB_TOKEN does not
# trigger other workflows — GitHub deliberately suppresses that to prevent
# workflow-recursion loops. That's why the "Gate" step below (which only
# needs to read comments and post non-triggering status notices) deliberately
# uses the default token: nothing it posts needs to trigger anything
# downstream.
#
# The "Claude PR Review" step (and the preflight step) is a DIFFERENT case:
# `claude-code-action@v1` authenticates via the Claude GitHub App's own
# installation token by default — NOT the job's GITHUB_TOKEN — so its
# comments are already authored by a real actor (`claude[bot]`), confirmed
# directly against PR #4's own review comment (`author: "claude"`). GitHub's
# recursion-suppression only applies to the default GITHUB_TOKEN, so this
# step's "@claude address the numbered items..." line already triggers
# claude.yml's issue_comment listener with NO extra token needed. (An
# earlier version of this file passed a `github_token` PAT override here,
# on the mistaken assumption this step also used the default token — that
# override actually broke it: the review ran 26 turns and posted nothing
# at all, silently. Do not reintroduce it without first confirming which
# identity actually posts the comment.)
#
# There used to be a companion `claude-dispatch.yml` that auto-kicked off
# the next Phase 2 item on PR merge — removed (see REVIEW_CRITERIA.md).
# Item kickoff is human-initiated now; this file's job ends at the verdict
# either way, unchanged.
#
# Review-only by design: `permissions.contents: read` means the job's own
# default token cannot push to the repo, and Edit/Write/NotebookEdit are
# deliberately left out of --allowedTools below — the App token only ever
# reaches GitHub's PR/issue API surface via `gh`/the inline-comment MCP
# tool, never local file writes.

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff stats
        id: diffstats
        # Pure git — no Python needed. Decides two things purely from the
        # diff's shape, before anything costs money: whether this PR is
        # docs-only (skip Claude entirely — see REVIEW_CRITERIA.md (n)),
        # and how large a turn budget the real review gets if it does run
        # (REVIEW_CRITERIA.md (m)).
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          CHANGED_LINES=$(git diff --shortstat "$BASE_SHA" "$HEAD_SHA" \
            | grep -oE '[0-9]+ (insertion|deletion)' | grep -oE '[0-9]+' \
            | awk '{sum+=$1} END {print sum+0}')

          DOCS_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) ;;
              *) DOCS_ONLY=false ;;
            esac
          done <<< "$CHANGED_FILES"

          MAX_TURNS=15
          if [ "$CHANGED_LINES" -gt 400 ]; then MAX_TURNS=50; fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "changed_lines=$CHANGED_LINES docs_only=$DOCS_ONLY max_turns=$MAX_TURNS"

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "changed_lines=$CHANGED_LINES" >> "$GITHUB_OUTPUT"
          echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"

      - name: Wait for CI's test check
        id: wait_ci
        if: steps.diffstats.outputs.docs_only != 'true'
        # ci.yml runs on the same `pull_request` trigger as this workflow
        # and starts at roughly the same time — polls rather than assuming
        # it's already finished. Treats "no check run yet" the same as
        # "in progress" (both keep polling); only a real terminal
        # conclusion or the timeout below ends the loop. This is what lets
        # the real review step trust CI's result as independent evidence
        # instead of re-running pytest itself (REVIEW_CRITERIA.md (i)).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DEADLINE=$((SECONDS + 600))
          STATUS=""
          CONCLUSION=""

          while [ $SECONDS -lt $DEADLINE ]; do
            RUN_JSON=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name=="test")] | sort_by(.started_at) | last // empty')
            STATUS=$(echo "$RUN_JSON" | jq -r '.status // empty' 2>/dev/null || echo "")
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // empty' 2>/dev/null || echo "")
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            echo "CI 'test' check status: ${STATUS:-not started yet} — waiting 15s"
            sleep 15
          done

          if [ "$STATUS" != "completed" ]; then
            echo "ci_conclusion=timeout" >> "$GITHUB_OUTPUT"
          elif [ "$CONCLUSION" = "success" ]; then
            echo "ci_conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "ci_conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved ci_conclusion: ${CONCLUSION:-<none>} (status=$STATUS)"

      - name: "Preflight: verify the Claude API is reachable"
        id: preflight
        if: steps.diffstats.outputs.docs_only != 'true' && steps.wait_ci.outputs.ci_conclusion == 'success'
        # Cheapest possible real call (1 turn, no tools) before committing
        # to the full review's turn budget. Exists specifically to catch
        # "the API is down/out of credit/unauthorized" BEFORE spending
        # real turns discovering that the hard way — see the result-check
        # step below for how its outcome is interpreted.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No --allowedTools override — an empty string risks being an
          # argument-parsing edge case in the one step whose entire job is
          # to give an unambiguous signal. The prompt needs no tools
          # regardless, so the action's own default tool set is harmless
          # here; --max-turns 1 is what actually keeps this cheap.
          claude_args: |
            --max-turns 1
          prompt: |
            Reply with exactly this and nothing else: PREFLIGHT_OK

      - name: Check preflight result
        id: preflight_check
        if: steps.diffstats.outputs.docs_only != 'true' && steps.wait_ci.outputs.ci_conclusion == 'success'
        # claude-code-action@v1 writes its execution result JSON to this
        # path (confirmed directly from run logs on PR #12/#14: "Log saved
        # to /home/runner/work/_temp/claude-execution-output.json").
        # A near-instant, zero-cost, single-turn failure is the exact
        # signature observed on both those PRs when the Claude API was
        # unreachable — a real content-driven failure burns real turns and
        # real cost first. Missing-output-file is folded into the same
        # "unavailable" bucket: if the preflight couldn't even produce its
        # own result, something is wrong before content review is even
        # reachable. This distinction is what lets a dry balance get
        # reported as REVIEW UNAVAILABLE instead of looking like a broken
        # PR (REVIEW ERRORED) — see REVIEW_CRITERIA.md (j).
        run: |
          OUT_FILE="/home/runner/work/_temp/claude-execution-output.json"
          if [ ! -f "$OUT_FILE" ]; then
            echo "No preflight execution output found — treating as unavailable."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_ERROR=$(jq -r '.is_error // false' "$OUT_FILE")
          COST=$(jq -r '.total_cost_usd // 0' "$OUT_FILE")
          TURNS=$(jq -r '.num_turns // 0' "$OUT_FILE")
          DURATION=$(jq -r '.duration_ms // 0' "$OUT_FILE")
          echo "Preflight: is_error=$IS_ERROR cost=$COST turns=$TURNS duration_ms=$DURATION"

          if [ "$IS_ERROR" = "true" ] && [ "$COST" = "0" ] && [ "$TURNS" -le 1 ] && [ "$DURATION" -lt 5000 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude PR Review
        id: claude_review
        if: steps.diffstats.outputs.docs_only != 'true' && steps.wait_ci.outputs.ci_conclusion == 'success' && steps.preflight_check.outputs.available == 'true'
        # Let a hard failure of this step (auth error, crash, the
        # max-turns cap being hit) fall through to the gate step below
        # instead of failing the job here directly — that step needs to
        # run regardless, specifically to distinguish "the review step
        # itself never finished" from "it finished and said no", and to
        # post a visible marker for the former so a dead review is never
        # silently indistinguishable from a real CHANGES REQUESTED verdict.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately no github_token override — see this file's header
          # comment. The action's default (Claude GitHub App installation
          # token) already posts as a real actor and already triggers
          # claude.yml's @claude listener; overriding it broke posting
          # entirely.
          claude_args: |
            --max-turns ${{ steps.diffstats.outputs.max_turns }}
            --allowedTools "Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated QA reviewer for this PR. Follow this
            procedure exactly, in order.

            ## Step 0 — escalation check (do this FIRST)

            Check this PR's existing review/comment history for how many
            times a previous automated review has posted the exact line
            "VERDICT: CHANGES REQUESTED" on this PR, e.g.:

              gh pr view ${{ github.event.pull_request.number }} --json comments,reviews

            If that count is already 3 or more, do NOT perform a new
            review. Instead post exactly one PR comment whose first line is:

            ESCALATE TO HUMAN

            followed by a short paragraph summarizing why this PR has
            stalled across three review cycles. Then stop completely — do
            not review the diff, do not post anything else.

            Otherwise, continue to Step 1.

            ## Step 1 — review

            Read REVIEW_CRITERIA.md at the repo root and apply it in full.
            Also read docs/BREACHREPLAY_GAME_OVERHAUL_SPEC.md and
            PHASE2_STATE.md — every finding must be checked against whether
            this diff conforms to the spec's Phase 2 section (section 4)
            and to what PHASE2_STATE.md says the current item actually is,
            not just general code quality.

            This review is READ-ONLY. You have no write access to repo
            contents in this job (contents: read) and no Edit/Write tools
            available. Do not attempt to edit files, commit, or push —
            investigate with Read/Grep/Glob/Bash only.

            The backend test suite has ALREADY been run independently by
            this repo's CI workflow on this exact commit, and this job
            confirmed it passed before invoking you — that is independent
            machine evidence, not a claim from the PR description, so you
            do not need to (and cannot — pytest's dependencies are not
            installed in this job) run it yourself. What you must still
            never do is accept the PR description's or commit messages'
            OWN claims about test status, scope, or correctness at face
            value — verify those against the actual diff yourself, the
            same as always. See REVIEW_CRITERIA.md (i) for the exact
            boundary between "independent evidence" (trusted) and
            "self-reported claims" (never trusted without verification).

            Check every BLOCKING criterion in REVIEW_CRITERIA.md
            explicitly and state a pass/fail for each one, not just a
            prose summary. Post inline comments
            (mcp__github_inline_comment__create_inline_comment) for
            findings tied to a specific line or file, and a single
            top-level PR comment (`gh pr comment ${{ github.event.pull_request.number }} --body "..."`)
            with your overall assessment.

            ## Step 2 — verdict

            End your top-level comment with EXACTLY one of these two lines
            verbatim, with nothing else on that line:

            VERDICT: APPROVED

            or

            VERDICT: CHANGES REQUESTED

            If CHANGES REQUESTED, immediately follow that line with a
            numbered list of the specific, concrete fixes required — one
            item per number, each naming the exact file and criterion
            (from REVIEW_CRITERIA.md) it addresses. Then end the SAME
            comment with this exact literal line, verbatim, as its own
            final line:

            @claude address the numbered items above in this PR's branch

            This is the mechanism that triggers the auto-fix round —
            claude.yml listens for an explicit @claude mention in a PR
            comment. Do not include this line at all when the verdict is
            APPROVED.

            Take no further action after posting the verdict — do not loop
            back and re-review, do not post additional commentary, and do
            not attempt to notify or dispatch anything else. A human
            merges this PR after seeing VERDICT: APPROVED; what happens
            next is handled by a separate workflow triggered on that
            merge, not by anything in this job.

      - name: Gate the check on the posted verdict
        # Runs regardless of what happened above — this is the single
        # place that decides pass/fail and posts every terminal status
        # comment, so there is exactly one source of truth for what this
        # check's red/green means. Four distinguishable outcomes now
        # (REVIEW_CRITERIA.md (i)/(j)/(m)/(n)): docs-only skip (pass, no
        # Claude spent), CI red (fail, no Claude spent), Claude API
        # unavailable (fail, clearly NOT a PR problem), and the original
        # two (a real verdict, or a genuine dead-review error). Deliberately
        # uses the default token, not CLAUDE_BOT_PAT — nothing this step
        # posts needs to trigger another workflow.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PR=${{ github.event.pull_request.number }}

          if [ "${{ steps.diffstats.outputs.docs_only }}" = "true" ]; then
            echo "Docs-only PR — passing without a Claude review."
            gh pr comment "$PR" --body "docs-only, review skipped"
            exit 0
          fi

          if [ "${{ steps.wait_ci.outputs.ci_conclusion }}" = "failure" ]; then
            echo "CI's test check failed on this SHA — failing this check with no Claude analysis spent."
            gh pr comment "$PR" --body "CI FAILED — this PR's tests are red on commit ${{ github.event.pull_request.head.sha }}; blocking without further review. Fix CI first."
            exit 1
          fi

          if [ "${{ steps.wait_ci.outputs.ci_conclusion }}" = "timeout" ]; then
            echo "CI's test check never completed within the wait window — failing closed."
            gh pr comment "$PR" --body "REVIEW ERRORED — CI's 'test' check never completed within the wait window; see run logs."
            exit 1
          fi

          if [ "${{ steps.preflight_check.outputs.available }}" = "false" ]; then
            echo "Preflight detected the Claude API is unavailable — not a PR problem."
            gh pr comment "$PR" --body "REVIEW UNAVAILABLE — the Claude API appears unreachable (billing, auth, or quota), not a problem with this PR. Check API key/billing status; admin-merge if urgent."
            exit 1
          fi

          if [ "${{ steps.claude_review.outcome }}" != "success" ]; then
            echo "Review step outcome: ${{ steps.claude_review.outcome }} — no verdict can be trusted."
            gh pr comment "$PR" --body "REVIEW ERRORED — no verdict, see run logs"
            exit 1
          fi

          # Anchored to a genuine standalone line (^...$), not a bare
          # substring search — Step 0's own escalation-check text writes
          # out the literal phrase "VERDICT: CHANGES REQUESTED" as prose
          # (quoting what it searched PR history for), which a substring
          # grep matches even on a comment whose REAL final verdict is
          # APPROVED. Joins every comment's body in order and takes the
          # LAST matching standalone line across the whole thread, so a
          # genuine re-review's newer verdict always wins over an older
          # quoted mention or a prior review cycle's verdict.
          verdict_line=$(gh pr view "$PR" --json comments \
            --jq '[.comments[].body] | join("\n") | split("\n") | map(select(test("^VERDICT: (APPROVED|CHANGES REQUESTED)\\s*$"))) | last // empty')

          if [ -z "$verdict_line" ]; then
            echo "Review step reported success but posted no verdict line — treating as a dead review."
            gh pr comment "$PR" --body "REVIEW ERRORED — no verdict, see run logs"
            exit 1
          fi

          if [ "$verdict_line" = "VERDICT: CHANGES REQUESTED" ]; then
            echo "Verdict: CHANGES REQUESTED — failing this check so branch protection blocks the merge."
            exit 1
          fi

          echo "Verdict: APPROVED."
