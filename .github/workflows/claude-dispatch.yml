name: Claude Item Dispatch

# Fires when a PR is merged into phase-2-action-console (or main — the
# very first merge that lands this loop's own setup is a main merge) and
# picks up the NEXT Phase 2 item, per PHASE2_STATE.md. This is the actual
# handoff mechanism: claude-review.yml only posts a verdict and stops (a
# comment posted via that job's GITHUB_TOKEN can't trigger another
# workflow, and dispatching on APPROVED would race ahead of the human
# merge decision anyway) — a human merges after seeing
# "VERDICT: APPROVED", and THAT merge is what this workflow reacts to.
#
# Skips merges that only touched .github/, docs/, or *.md files — e.g.
# this workflow's own setup PR, or a pure documentation change — since
# those aren't a completed implementation item to build on top of.
#
# Full write access (agent mode, not review-only): this job actually
# implements the next item and opens a new PR for it, which then goes
# through claude-review.yml like any other PR.

on:
  pull_request:
    types: [closed]

jobs:
  check-relevance:
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'phase-2-action-console' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.filter.outputs.skip }}
    steps:
      - name: Check whether the merged PR touched anything besides docs/workflows
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json files --jq '.files[].path')
          echo "Changed files in PR #${{ github.event.pull_request.number }}:"
          echo "$changed"
          meaningful=$(echo "$changed" | grep -vE '^(\.github/|docs/|[^/]*\.md$)' || true)
          if [ -z "$meaningful" ]; then
            echo "Only docs/workflow files changed — skipping dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: check-relevance
    if: needs.check-relevance.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout the just-updated base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Dispatch next Phase 2 item
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ github.event.pull_request.base.ref }}
          claude_args: |
            --max-turns 100
          prompt: |
            REPO: ${{ github.repository }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            JUST-MERGED PR: #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}")

            You are already checked out on the base branch above, updated
            with the PR that just merged. Do the following:

            1. Read PHASE2_STATE.md at the repo root.

            2. If it shows a next, unstarted Phase 2 item:
               - Mark that item as in-progress in PHASE2_STATE.md.
               - Cut a new branch off the current base branch, named for
                 the item (e.g. phase-2-item-4-daily-breach).
               - Implement that item in full, following its instructions
                 in PHASE2_STATE.md exactly, and following
                 REVIEW_CRITERIA.md's rules as you go (leak safety,
                 determinism, org-tabletop isolation, playability, server
                 authority, migration hygiene) — this work will be
                 reviewed against that checklist.
               - Update PHASE2_STATE.md as part of the same work, marking
                 the item complete and describing what's next.
               - Run the backend test suite yourself
                 (cd backend && pytest -q) and confirm it is green before
                 opening a PR. Do not open a PR with failing tests.
               - Open a PR from your new branch into
                 phase-2-action-console (NOT into main — only the very
                 first, already-merged setup PR targeted main).

            3. If PHASE2_STATE.md shows that every Phase 2 item is
               already complete:
               - Do not implement anything new.
               - Instead, cut a new branch, and on it create ONLY
                 PHASE2_ACCEPTANCE.md at the repo root: a report that
                 walks every acceptance criterion in
                 docs/BREACHREPLAY_GAME_OVERHAUL_SPEC.md section 4 one by
                 one, states whether it is verifiably met, and how you
                 verified it (a specific test, a specific command run and
                 its output — not an assertion).
               - Open a PR from that branch into phase-2-action-console
                 containing only that report.

            In either case, write a clear PR description explaining what
            you did and why, and end your work there — do not merge your
            own PR, do not start a second item.
